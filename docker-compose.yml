version: '2.3'

x-lagoon-project:
  &lagoon-project test-nodejs

services:
  node:
    image: uselagoon/node-22:latest
    labels:
      lagoon.type: node
    expose:
      - "3000"
    volumes:
      - .:/app:delegated
    command: node -e "const h=require('http'); h.createServer((_,r)=>{r.writeHead(200);r.end('Seedcloud OK\n')}).listen(3000,()=>console.log('Ready'))"

networks: {}
